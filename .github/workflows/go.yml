name: Go CI

on:
  pull_request:
    paths:
      - "**/*.go"
  push:
    branches: [main, dev]
    paths:
      - "**/*.go"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - 00-foundations/first-agent-hello-world/go

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
