# Default values for adk-agent
replicaCount: 3

image:
  repository: adk-agent
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

# Agent configuration
agent:
  env: prod
  model: gemini-2.5-flash
  maxTurns: 10
  logLevel: info

# Redis session backend
redis:
  enabled: true
  url: "" # Set via external secret

# Secrets (external)
secrets:
  googleApiKey: "" # Set via --set or external secret
  googleApiKeyExistingSecret: "" # Name of existing k8s secret

# Observability
observability:
  otel:
    enabled: true
    endpoint: http://tempo:4317
  metrics:
    enabled: true
    port: 9090

# Health checks
health:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Graceful shutdown
terminationGracePeriodSeconds: 60

# Node affinity
affinity: {}

# Tolerations
tolerations: []

# Pod annotations
podAnnotations: {}
