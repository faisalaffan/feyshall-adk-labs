name: Agent Evaluation

on:
  pull_request:
    paths:
      - "agents/**"
      - "tools/**"
      - "prompts/**"
      - "**/recipe/**"
  push:
    branches: [main, dev]

jobs:
  safety-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-adk pytest

      - name: Run safety evaluation
        run: python -m pytest tests/eval/test_safety.py -v
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EVAL_SAFETY_THRESHOLD: "1.0"

  accuracy-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-adk pytest

      - name: Run accuracy evaluation
        run: python -m pytest tests/eval/test_accuracy.py -v
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EVAL_ACCURACY_THRESHOLD: "0.85"

  regression-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-adk pytest

      - name: Run regression tests
        run: python -m pytest tests/eval/test_regression.py -v
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
